[project]
name = "rlm-local"
version = "0.1.0"
description = "RLM harness for small local language models"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "setuptools>=83.0.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0.0",
    "gepa>=0.1.4",
    "litellm>=1.93.0",
    "tenacity>=9.1.4",
]

[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "slow: marks tests as slow (deselect with '-k \"not slow\"')",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-timeout>=2.4.0",
]
