{% extends "base.html" %}
{% block title %}Job {{ job.id }}{% endblock %}
{% block content %}
<h2>Job: {{ job.query[:80] }}</h2>
<div class="card">
    <strong>State:</strong> <span id="job-state">{{ job.state }}</span>
    <strong>Profile:</strong> {{ job.profile }}
</div>

<div class="card">
    <h3>Live Progress</h3>
    <div id="events" class="events">
        Connecting to job stream...
    </div>
</div>

<div id="answer-section" class="card" style="display:none;">
    <h3>Answer</h3>
    <pre id="answer-text"></pre>
</div>

<script>
    (function() {
        var el = document.getElementById('events');
        var stateEl = document.getElementById('job-state');
        var answerSection = document.getElementById('answer-section');
        var answerText = document.getElementById('answer-text');
        var es = new EventSource('/jobs/{{ job.id }}/events');
        el.textContent = '';

        es.onmessage = function(evt) {
            var data = JSON.parse(evt.data);
            if (data.type === 'started') {
                el.textContent = data.message + '\n';
            } else if (data.type === 'done') {
                stateEl.textContent = 'done';
                answerText.textContent = data.answer;
                answerSection.style.display = 'block';
                es.close();
            } else if (data.type === 'error') {
                el.textContent += '\nERROR: ' + data.message;
                stateEl.textContent = 'error';
                es.close();
            }
        };

        es.onerror = function() {
            el.textContent += '\nConnection lost. The job may still be running.';
            es.close();
        };
    })();
</script>
{% endblock %}
